[project]
name = "netmap-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Windows + Python 3.10.0: the Proactor event loop garbage-collects already-closed MongoDB
    # sockets after TestClient shuts its loop down. Harmless and fixed in later Python releases.
    "ignore:Exception ignored in. <function _ProactorBasePipeTransport.__del__:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bugbear, S: bandit-style security checks, UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things
"tests/*" = ["S101", "S105", "S106"]
