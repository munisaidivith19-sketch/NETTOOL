[project]
name = "netmap-agent"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things; tests use fake lab passwords
"tests/*" = ["S101", "S105", "S106"]
